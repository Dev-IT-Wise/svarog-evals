schema_version: "1.1"
name: superpowers-r2-done-backoff
description: T5 arm superpowers on task r2-done-backoff.
tags: [t5, arm-superpowers, task-r2-done-backoff]
plugins: ["../../plugins/superpowers", "../../plugins/t5-evidence"]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 150
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate, TaskStop]
  prompt: |
    Unattended run, answers file: answers.toml. Nobody will answer questions
    during this run: wherever you would ask or wait for approval, take the
    option you would recommend, say which, and go on. When the work is
    finished, merge it into `main` in this repository. Do not push and do not
    open a pull request.

    Bug report: giving up because the wait generator ran out does not behave
    like any other give-up. With a finite generator, for example
    `backoff.constant` with `interval=[1, 2]`:

    1. `@backoff.on_exception(..., raise_on_giveup=False)` re-raises the
       exception instead of returning `None`.
    2. `@backoff.on_predicate` calls its `on_giveup` handlers with a `details`
       dict that has no `"value"`, so a handler that reads `details["value"]`
       raises `KeyError`.

    A give-up has to behave the same whatever caused it - `max_tries`,
    `max_time`, `giveup` or an exhausted generator - for both decorators, and
    for coroutines as well as plain functions.

    Tests: `.venv/bin/python -m pytest -q`
graders:
  - type: regex
    name: integrated-into-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^integrated yes$'
    flags: m
  - type: regex
    name: visible-tests-pass-on-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^visible-exit 0$'
    flags: m
  - type: regex
    name: hidden-acceptance-passes-on-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^hidden-exit 0$'
    flags: m
