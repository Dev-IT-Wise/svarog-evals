# Generated by _tasks/make-cases.sh - edit the prompts there, not here.
schema_version: "1.1"
name: superpowers-r2-scope-semver
description: T5 arm superpowers on task r2-scope-semver.
tags: [t5, arm-superpowers, task-r2-scope-semver]
plugins: ["../../plugins/superpowers", "../../plugins/t5-evidence"]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 150
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate, TaskStop]
  prompt: |
    Unattended run, answers file: answers.toml. Nobody will answer questions
    during this run: wherever you would ask or wait for approval, take the
    option you would recommend, say which, and go on. When the work is
    finished, merge it into `main` in this repository. Do not push and do not
    open a pull request.

    Feature request: the `pysemver` command line rejects the `v` prefix that
    git tags carry. `pysemver bump patch v1.2.3` fails with
    `ERROR v1.2.3 is not valid SemVer string`. Make every subcommand accept a
    version with a leading `v` or `V`:

    - `bump` and `nextver` print the result with the same prefix
      (`pysemver bump patch v1.2.3` prints `v1.2.4`);
    - `compare` accepts it on either argument;
    - `check` accepts it.

    This is a small change to the command line only: keep it to
    `src/semver/cli.py` and its tests.

    Tests: `.venv/bin/python -m pytest -q`
graders:
  - type: regex
    name: integrated-into-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^integrated yes$'
    flags: m
  - type: regex
    name: visible-tests-pass-on-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^visible-exit 0$'
    flags: m
  - type: regex
    name: hidden-acceptance-passes-on-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^hidden-exit 0$'
    flags: m
