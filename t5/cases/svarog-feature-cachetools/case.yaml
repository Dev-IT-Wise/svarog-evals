schema_version: "1.1"
name: svarog-feature-cachetools
description: T5 arm svarog on task feature-cachetools.
tags: [t5, arm-svarog, task-feature-cachetools]
plugins: ["../../plugins/svarog", "../../plugins/svarog-evidence", "../../plugins/t5-evidence"]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 150
  timeout_seconds: 3600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate, TaskStop]
  prompt: |
    Unattended run, answers file: answers.toml. Nobody will answer questions
    during this run: wherever you would ask or wait for approval, take the
    option you would recommend, say which, and go on. When the work is
    finished, merge it into `main` in this repository. Do not push and do not
    open a pull request.

    Add a `resize(maxsize)` method to `cachetools.Cache`, so that every cache
    class has it. After the call `cache.maxsize` is the new value. If
    `currsize` is then above it, items are evicted the way that class evicts
    on insert until `currsize <= maxsize`: FIFOCache drops the oldest item,
    LRUCache the least recently used, LFUCache the least frequently used,
    RRCache random items, and TTLCache and TLRUCache first drop expired items,
    then follow their own order. Sizes come from `getsizeof`, as everywhere
    else in the library. Growing never evicts. A negative `maxsize` raises
    `ValueError`, as the constructor does, and leaves the cache unchanged.

    Tests: `PYTHONPATH=src .venv/bin/python -m pytest -q`
graders:
  - type: regex
    name: integrated-into-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^integrated yes$'
    flags: m
  - type: regex
    name: visible-tests-pass-on-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^visible-exit 0$'
    flags: m
  - type: regex
    name: hidden-acceptance-passes-on-main
    target: {source: file, path: .eval-evidence/t5.txt}
    pattern: '^hidden-exit 0$'
    flags: m
